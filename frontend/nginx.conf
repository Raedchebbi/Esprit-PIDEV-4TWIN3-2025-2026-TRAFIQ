server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The exporter sidecar scrapes this local-only endpoint.
  location = /stub_status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    deny all;
  }

  # Avoid caching runtime configuration so ConfigMap changes take effect on restart.
  location = /runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
