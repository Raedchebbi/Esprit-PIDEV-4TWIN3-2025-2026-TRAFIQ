apiVersion: v1
kind: Namespace
metadata:
  name: trafiq
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trafiq-backend-config
  namespace: trafiq
data:
  NODE_ENV: production
  BACKEND_PORT: "3000"
  # Override with your production origin(s) before internet exposure.
  CORS_ORIGIN: "http://localhost,http://127.0.0.1,http://localhost:5173"
  WS_NAMESPACE: "/"
  MONGODB_DB_NAME: "trafiq"
  USE_MONGO_AS_PRIMARY: "true"
  USE_REDIS: "true"
  USE_CENTRAL_SESSIONS: "true"
  REDIS_HOST: "trafiq-redis"
  REDIS_PORT: "6379"
  MONGODB_MAX_POOL_SIZE: "20"
  MONGODB_MIN_POOL_SIZE: "0"
  MONGODB_SERVER_SELECTION_TIMEOUT_MS: "5000"
  MONGODB_TTL_DAYS: "30"
  MONGODB_FAIL_FAST: "false"
  RATE_LIMIT_LOGIN_LIMIT: "5"
  RATE_LIMIT_LOGIN_TTL_MS: "60000"
  RATE_LIMIT_NAV_START_LIMIT: "20"
  RATE_LIMIT_NAV_START_TTL_MS: "60000"
  RATE_LIMIT_NAV_UPDATE_LIMIT: "120"
  RATE_LIMIT_NAV_UPDATE_TTL_MS: "60000"
  RATE_LIMIT_NAV_END_LIMIT: "30"
  RATE_LIMIT_NAV_END_TTL_MS: "60000"
  RATE_LIMIT_PUBLIC_ROUTE_LIMIT: "60"
  RATE_LIMIT_PUBLIC_ROUTE_TTL_MS: "60000"
  RATE_LIMIT_AI_WS_LIMIT: "600"
  RATE_LIMIT_AI_WS_TTL_MS: "60000"
  RATE_LIMIT_PUBLIC_WS_POSITION_LIMIT: "120"
  RATE_LIMIT_PUBLIC_WS_POSITION_TTL_MS: "60000"
  RATE_LIMIT_PUBLIC_WS_SUBSCRIBE_LIMIT: "30"
  RATE_LIMIT_PUBLIC_WS_SUBSCRIBE_TTL_MS: "60000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trafiq-frontend-config
  namespace: trafiq
data:
  # These values are rendered into runtime-config.js by the Nginx entrypoint script.
  # REST calls go through the same-origin ingress path.
  VITE_API_URL: "/api"
  VITE_BACKEND_URL: "/api"
  # Socket.io uses the current browser origin plus a dedicated ingress path.
  VITE_WS_URL: "__CURRENT_ORIGIN__"
  VITE_SOCKET_IO_PATH: "/api/socket.io"
  VITE_MAP_DEFAULT_LAT: "36.8068"
  VITE_MAP_DEFAULT_LNG: "10.1816"
  VITE_MAP_DEFAULT_ZOOM: "14"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trafiq-ai-config
  namespace: trafiq
data:
  NESTJS_URL: "http://trafiq-backend:3000"
  CAMERAS_CONFIG: "/app/cameras.json"
  AI_HEALTH_FILE: "/tmp/trafiq-ai-ready"
  ENABLE_RISK_ASSESSMENT: "true"
  SHOW_DISPLAY: "false"
  BASE_CONF: "0.35"
  IOU_THRESHOLD: "0.4"
  IOU_MAX_THRESHOLD: "0.85"
  PROXIMITY_THRESHOLD: "0.18"
  MIN_PAIR_CONF: "0.5"
  SPEED_DROP_THRESHOLD: "12"
  MIN_BOX_AREA: "3000"
  MIN_BOX_SIZE_RATIO: "0.25"
  SPEED_HIGH_THRESHOLD: "8.0"
  CONFIRMATION_FRAMES: "3"
  COOLDOWN_FRAMES: "500"
  MIN_INCIDENT_CONF: "0.55"
  RISK_FRAME_INTERVAL: "60"
  MIN_GROQ_INTERVAL_S: "15"
  VEHICLE_COUNT_INTERVAL: "15"
  MAX_RECONNECT_ATTEMPTS: "10"
