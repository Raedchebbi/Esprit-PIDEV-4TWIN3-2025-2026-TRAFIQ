apiVersion: v1
kind: Namespace
metadata:
  name: trafiq
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trafiq-backend-config
  namespace: trafiq
data:
  NODE_ENV: production
  BACKEND_PORT: "3000"
  # Hostless ingress works with localhost or a node IP, so keep local origins allowed.
  CORS_ORIGIN: "http://localhost,http://127.0.0.1,http://localhost:5173"
  WS_NAMESPACE: "/"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trafiq-frontend-config
  namespace: trafiq
data:
  # These values are rendered into runtime-config.js by the Nginx entrypoint script.
  # REST calls go through the same-origin ingress path.
  VITE_API_URL: "/api"
  VITE_BACKEND_URL: "/api"
  # Socket.io uses the current browser origin plus a dedicated ingress path.
  VITE_WS_URL: "__CURRENT_ORIGIN__"
  VITE_SOCKET_IO_PATH: "/api/socket.io"
  VITE_MAP_DEFAULT_LAT: "36.8068"
  VITE_MAP_DEFAULT_LNG: "10.1816"
  VITE_MAP_DEFAULT_ZOOM: "14"
