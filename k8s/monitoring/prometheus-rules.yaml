apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trafiq-platform-rules
  namespace: monitoring
spec:
  groups:
    - name: trafiq.availability
      rules:
        - alert: TrafiqBackendDown
          expr: up{job="trafiq-backend"} == 0
          for: 2m
          labels:
            severity: critical
            service: backend
          annotations:
            summary: Backend target is down
            description: The backend Prometheus target has been unreachable for more than 2 minutes.
        - alert: TrafiqFrontendDown
          expr: up{job="trafiq-frontend"} == 0
          for: 2m
          labels:
            severity: critical
            service: frontend
          annotations:
            summary: Frontend target is down
            description: The frontend Nginx exporter target has been unreachable for more than 2 minutes.
    - name: trafiq.reliability
      rules:
        - alert: TrafiqCrashLooping
          expr: sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace="trafiq"}[10m])) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Pod is crash-looping
            description: A TRAFIQ pod restarted more than three times in the last 10 minutes.
        - alert: TrafiqHighErrorRate
          expr: |
            100 *
            sum(rate(http_requests_total{app="trafiq-backend",status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{app="trafiq-backend"}[5m])), 1)
            > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Backend 5xx error rate is above 5%
            description: The backend returned more than 5% HTTP 5xx responses during the last 10 minutes.
