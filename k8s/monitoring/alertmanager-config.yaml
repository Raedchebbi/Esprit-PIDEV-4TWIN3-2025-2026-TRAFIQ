apiVersion: v1
kind: Secret
metadata:
  name: trafiq-alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
      # Replace the demo webhook URL in the Kubernetes Secret before production use.
      receiver: demo-webhook
    receivers:
      - name: demo-webhook
        webhook_configs:
          - url: 'http://alertmanager-webhook-placeholder.monitoring.svc.cluster.local:8080/alerts'
            send_resolved: true
