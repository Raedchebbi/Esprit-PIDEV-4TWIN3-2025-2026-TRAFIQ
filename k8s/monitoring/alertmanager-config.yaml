apiVersion: v1
kind: Secret
metadata:
  name: trafiq-alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
      # Replace the null receiver with email, Slack, or webhook receivers in production.
      receiver: null-receiver
    receivers:
      - name: null-receiver
