apiVersion: v1
kind: ConfigMap
metadata:
  name: trafiq-http-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  trafiq-http-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{app=\"trafiq-backend\"}[5m])) by (route)",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ],
          "title": "Backend Requests per Second",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 0},
          "id": 2,
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{app=\"trafiq-backend\",status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{app=\"trafiq-backend\"}[5m])), 1)",
              "refId": "A"
            }
          ],
          "title": "Backend 5xx Error Rate",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 0},
          "id": 3,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{app=\"trafiq-backend\"}[5m])) by (le))",
              "refId": "A"
            }
          ],
          "title": "Backend p95 Latency",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "id": 4,
          "targets": [
            {
              "expr": "rate(nginx_http_requests_total{job=\"trafiq-frontend\"}[5m])",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "title": "Frontend Nginx Requests per Second",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["trafiq", "http"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "TRAFIQ Application HTTP",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trafiq-pod-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  trafiq-pod-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"trafiq\",container!=\"\",image!=\"\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "CPU Usage by Pod",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"trafiq\",container!=\"\",image!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Memory Usage by Pod",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "id": 3,
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"trafiq\"}[1h])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Container Restarts in the Last Hour",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["trafiq", "kubernetes"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "TRAFIQ Pod Resource Usage",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trafiq-delivery-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  trafiq-delivery-dashboard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {
              "expr": "100 * kube_deployment_status_replicas_available{namespace=\"trafiq\"} / clamp_min(kube_deployment_spec_replicas{namespace=\"trafiq\"}, 1)",
              "legendFormat": "{{deployment}}",
              "refId": "A"
            }
          ],
          "title": "Deployment Availability",
          "type": "bargauge"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "targets": [
            {
              "expr": "sum(ALERTS{namespace=\"trafiq\",alertstate=\"firing\"})",
              "refId": "A"
            }
          ],
          "title": "Active Alerts",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "targets": [
            {
              "expr": "sum(kube_deployment_metadata_generation{namespace=\"trafiq\"} - kube_deployment_status_observed_generation{namespace=\"trafiq\"})",
              "refId": "A"
            }
          ],
          "title": "Pending Rollout Generations",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "id": 4,
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"trafiq\"}[10m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Crash Loops During the Last 10 Minutes",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["trafiq", "cicd"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "TRAFIQ CI/CD and Rollout Health",
      "version": 1
    }
