apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafiq-backend
  namespace: trafiq
  labels:
    app.kubernetes.io/name: trafiq-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trafiq-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafiq-backend
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets:
        - name: dockerhub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: docker.io/mohamedkhalil26/trafiq-backend:REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: trafiq-backend-config
            - secretRef:
                name: trafiq-backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: trafiq-backend
  namespace: trafiq
  labels:
    app.kubernetes.io/name: trafiq-backend
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: trafiq-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trafiq-backend
  namespace: trafiq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trafiq-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
