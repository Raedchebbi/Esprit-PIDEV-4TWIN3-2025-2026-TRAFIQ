apiVersion: v1
kind: Secret
metadata:
  name: trafiq-backend-secrets
  namespace: trafiq
type: Opaque
stringData:
  # Replace this value for manual deployments. The GitHub CD workflows create
  # the real secret from repository secrets so credentials never live in git.
  JWT_SECRET: replace-me-with-a-long-random-string
  AI_WS_TOKEN: replace-me-with-a-long-random-ai-producer-token
  MONGODB_URI: mongodb://trafiq-mongodb:27017
  REDIS_PASSWORD: ""
  INITIAL_SUPER_ADMIN_EMAIL: admin@example.com
  INITIAL_SUPER_ADMIN_PASSWORD: replace-me-with-initial-admin-password
  INITIAL_SUPER_ADMIN_NAME: Initial Super Admin
---
apiVersion: v1
kind: Secret
metadata:
  name: trafiq-ai-secrets
  namespace: trafiq
type: Opaque
stringData:
  AI_WS_TOKEN: replace-me-with-a-long-random-ai-producer-token
  GROQ_API_KEY: replace-me-with-groq-api-key
