apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trafiq-backend
  namespace: trafiq
  annotations:
    # Strip the /api prefix before forwarding traffic to the NestJS service.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Socket.io connections benefit from longer timeouts than the ingress defaults.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: trafiq-backend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trafiq-frontend
  namespace: trafiq
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trafiq-frontend
                port:
                  number: 80
