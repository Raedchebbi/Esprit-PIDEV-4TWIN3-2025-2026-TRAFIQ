apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafiq-frontend
  namespace: trafiq
  labels:
    app.kubernetes.io/name: trafiq-frontend
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trafiq-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafiq-frontend
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: dockerhub-registry
      containers:
        - name: frontend
          image: docker.io/mohamedkhalil26/trafiq-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: trafiq-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args:
            - -nginx.scrape-uri=http://127.0.0.1:8080/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trafiq-frontend
  namespace: trafiq
  labels:
    app.kubernetes.io/name: trafiq-frontend
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: trafiq-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9113
      targetPort: metrics
