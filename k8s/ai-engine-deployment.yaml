apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafiq-ai-engine
  namespace: trafiq
  labels:
    app.kubernetes.io/name: trafiq-ai-engine
    app.kubernetes.io/component: ai-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trafiq-ai-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafiq-ai-engine
        app.kubernetes.io/component: ai-worker
    spec:
      imagePullSecrets:
        - name: dockerhub-registry
      containers:
        - name: ai-engine
          image: docker.io/mohamedkhalil26/trafiq-ai-engine:REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: trafiq-ai-config
            - secretRef:
                name: trafiq-ai-secrets
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f ${AI_HEALTH_FILE:-/tmp/trafiq-ai-ready}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test -f ${AI_HEALTH_FILE:-/tmp/trafiq-ai-ready}
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
