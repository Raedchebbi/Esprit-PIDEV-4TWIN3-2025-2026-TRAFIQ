apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafiq-redis
  namespace: trafiq
  labels:
    app.kubernetes.io/name: trafiq-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trafiq-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafiq-redis
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trafiq-redis
  namespace: trafiq
  labels:
    app.kubernetes.io/name: trafiq-redis
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: trafiq-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trafiq-redis
  namespace: trafiq
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trafiq-redis
