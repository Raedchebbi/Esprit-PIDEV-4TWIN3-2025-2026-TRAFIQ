apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafiq-mongodb
  namespace: trafiq
  labels:
    app.kubernetes.io/name: trafiq-mongodb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trafiq-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trafiq-mongodb
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:7.0.16
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongodb
              containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          readinessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: mongodb-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: trafiq-mongodb
  namespace: trafiq
  labels:
    app.kubernetes.io/name: trafiq-mongodb
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: trafiq-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trafiq-mongodb
  namespace: trafiq
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trafiq-mongodb
