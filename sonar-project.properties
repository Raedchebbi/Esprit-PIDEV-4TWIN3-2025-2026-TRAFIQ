# Shared SonarQube configuration for the TRAFIQ monorepo.
#
# Each CI workflow injects the service-specific project key, name, source paths,
# test paths, and coverage files so backend and frontend can be analyzed as
# separate SonarQube projects without duplicating these common defaults.

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Ignore generated output and operational assets that should not affect code quality.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/test-results/**,**/.scannerwork/**,**/external-skills/**,**/k8s/**,**/.github/**

# Do not count test files, entrypoints, or tooling config files in coverage targets.
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.js,**/*.test.jsx,**/test/**,**/main.ts,**/vite.config.js,**/eslint.config.js,**/*.config.js,**/*.config.ts
